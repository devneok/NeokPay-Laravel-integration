name: Package compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', laravel: 11}
          - {php: '8.4', laravel: 11}
          - {php: '8.3', laravel: 12}
          - {php: '8.4', laravel: 12}
          - {php: '8.4', laravel: 13}
    steps:
      - name: Checkout Laravel integration
        uses: actions/checkout@v7.0.1
        with:
          path: packages/neokpay-laravel
          persist-credentials: false
      - name: Checkout public SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: devneok/NeokPay-PHP-SDK
          ref: main
          path: packages/neokpay-php
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl
          tools: composer:v2
          coverage: none
      - name: Validate publishable metadata
        run: |
          composer validate --strict --no-check-lock --working-dir=packages/neokpay-laravel
      - name: Validate sibling SDK metadata
        run: composer validate --strict --working-dir=packages/neokpay-php
      - name: Generate isolated test root
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
        run: |
          # Beta metadata/path wiring is confined to this generated test root.
          php packages/neokpay-laravel/tests/matrix.php "$RUNNER_TEMP/neokpay-matrix" "$LARAVEL_MAJOR"
      - name: Install matrix dependencies
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: composer install --no-interaction --prefer-dist
      - name: Validate matrix metadata
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: composer validate --strict
      - name: PHPUnit
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: php vendor/bin/phpunit --do-not-cache-result
      - name: Larastan
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: php vendor/bin/phpstan analyse --no-progress
