name: Package compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', laravel: 11}
          - {php: '8.4', laravel: 11}
          - {php: '8.3', laravel: 12}
          - {php: '8.4', laravel: 12}
          - {php: '8.4', laravel: 13}
    steps:
      - name: Checkout Laravel integration
        uses: actions/checkout@v7.0.1
        with:
          path: packages/neokpay-laravel
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl
          tools: composer:v2
          coverage: none
      - name: Validate publishable metadata
        run: |
          composer validate --strict --no-check-lock --working-dir=packages/neokpay-laravel
      - name: Generate isolated test root
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
        run: |
          # Only the unpublished wrapper uses a path repository. SDK is from Packagist.
          php packages/neokpay-laravel/tests/matrix.php "$RUNNER_TEMP/neokpay-matrix" "$LARAVEL_MAJOR" registry
      - name: Install matrix dependencies
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: composer install --no-interaction --prefer-dist
      - name: Verify published SDK provenance
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: |
          composer show devneok/neokpay-php --all
          php "$GITHUB_WORKSPACE/packages/neokpay-laravel/tests/verify-registry-sdk.php" "$PWD"
      - name: Validate matrix metadata
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: composer validate --strict
      # Laravel 11.56.1 has no patched 11.x successor for these advisories:
      # PKSA-m5cs-t1y6-qpcs, PKSA-3r5d-mb8f-1qw9, PKSA-mdq4-51ck-6kdq.
      # The test root bypasses blocking ONLY for these IDs, never their audit.
      # New/other findings still fail; green means compatibility, not security.
      - name: Report Laravel 11 security advisories
        if: matrix.laravel == 11
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: |
          audit_exit=0
          composer audit --locked --format=json > composer-audit.json || audit_exit=$?
          cat composer-audit.json
          php "$GITHUB_WORKSPACE/packages/neokpay-laravel/tests/check-laravel11-audit.php" composer-audit.json "$audit_exit"
      - name: PHPUnit
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: php vendor/bin/phpunit --do-not-cache-result
      - name: Larastan
        working-directory: ${{ runner.temp }}/neokpay-matrix
        run: php vendor/bin/phpstan analyse --no-progress
